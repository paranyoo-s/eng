const $=s=>document.querySelector(s),out=$("#out"),tabs=$("#tabs");let cur=0;
M.forEach((m,i)=>{const b=document.createElement("button");b.textContent="Module "+(i+1);b.onclick=()=>{cur=i;$("#q").value="";render()};tabs.append(b)});
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function render(){
 [...tabs.children].forEach((b,i)=>b.classList.toggle("on",i==cur));
 const q=$("#q").value.trim().toLowerCase(),mods=q?M.map((_,i)=>i):[cur];let h="",all="";
 mods.forEach(i=>{const m=M[i];let s="";h="";
  m.lang.forEach(([a,b,p])=>{const L=p.filter(x=>!q||(a+b+x).toLowerCase().includes(q));if(L.length)s+=`<div class="card"><b>${esc(a)}</b><small>${esc(b)}</small><ul>${L.map(x=>{const[e,t]=x.split("|");return `<li>${esc(e)}${t?` <span class="ex">— ${esc(t)}</span>`:""}</li>`}).join("")}</ul></div>`});
  if(s)h+=`<h3>Language Focus</h3>`+s;s="";
  m.gram.forEach(g=>{const [a,d,e]=g.length==4?[g[0],g[2],g[3]]:[g[0],g[1],g[2]];if(q&&!(a+d+e.join()).toLowerCase().includes(q))return;s+=`<div class="card"><b>${esc(a)}</b>${esc(d)}<ul>${e.map(x=>`<li class="ex">${esc(x)}</li>`).join("")}</ul></div>`});
  if(s)h+=`<h3>Grammar (ไวยากรณ์)</h3>`+s;s="";
  m.v.forEach(([n,w])=>{const r=w.map(x=>x.split("|")).filter(x=>!q||x.join(" ").toLowerCase().includes(q));if(r.length)s+=`<div class="card"><b>${esc(n)}</b><div class="tbl"><table><tr><th>Word</th><th>ชนิด</th><th>ความหมาย</th></tr>${r.map(x=>`<tr><td>${esc(x[0])}</td><td class="pos">${x[1]}</td><td>${esc(x[2])}</td></tr>`).join("")}</table></div></div>`});
  if(s)h+=`<h3>Vocabulary (คำศัพท์)</h3>`+s;
  if(h)h=`<h2>${m.t}</h2><p class="th">${m.th}</p>`+h;all+=h;
 });
 out.innerHTML=all||"<p class='th'>ไม่พบผลลัพธ์</p>";scrollTo(0,0);
}

["Components of a research article (12)","องค์ประกอบ",["1 Title|ชื่อเรื่อง บอกหัวข้อและขอบเขต","2 Abstract|บทคัดย่อ: จุดประสงค์ วิธี ผล สรุป และ keywords","3 Introduction|ที่มา เหตุผล ทบทวนวรรณกรรม ปัญหา/คำถามวิจัย วัตถุประสงค์และสมมติฐาน","4 Objectives|เป้าหมายของการวิจัย","The objective/purpose of this study is to…|วัตถุประสงค์ของงานนี้คือ…","This study aims to… / Our goals are to…|งานนี้มุ่งที่จะ… / เป้าหมายของเราคือ…","We hypothesize that…|เราตั้งสมมติฐานว่า…","5 Literature Review|สรุปและวิเคราะห์งานก่อนหน้า หาช่องว่างความรู้","6 Methods|ออกแบบวิจัย ผู้เข้าร่วม/กลุ่มตัวอย่าง เครื่องมือ (ความตรง/ความเชื่อถือได้) การเก็บและวิเคราะห์ข้อมูล","7 Results|ผลการวิจัย: คำบรรยาย ตาราง/รูป สถิติและนัยสำคัญ","8 Discussion|ตีความผล เทียบงานก่อน ข้อจำกัด ข้อเสนอวิจัยต่อ","9 Conclusion|สรุปผลหลักและความสำคัญ อาจเสนอการนำไปใช้/นโยบาย","10 References|รายการแหล่งที่อ้างถึง","11 Acknowledgments|ขอบคุณผู้/องค์กรที่ช่วยแต่ไม่ใช่ผู้เขียน","12 Appendices|ภาคผนวก: ข้อมูลดิบ วิธีละเอียด การวิเคราะห์เพิ่ม"]],
